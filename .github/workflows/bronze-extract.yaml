name: Bronze Layer - Data Extraction

on:
  workflow_dispatch:
    inputs:
      max_repos:
        description: 'Cap on repositories fetched (blank = no cap, full extraction). Useful for quick local tests via act.'
        required: false
        type: string
        default: ''
      max_commits_per_repo:
        description: 'Cap on commits fetched per repo (blank = no cap, full extraction). Useful for quick local tests via act.'
        required: false
        type: string
        default: ''
      skip_structure:
        description: 'Skip repository structure extraction (faster)'
        required: false
        type: boolean
        default: false
      since:
        description: 'Only extract commits since this ISO-8601 timestamp (blank = full history). E.g. 2026-01-01T00:00:00Z'
        required: false
        type: string
        default: ''
      max_issues:
        description: 'Cap on issues fetched per repo (blank = no cap)'
        required: false
        type: string
        default: ''
      max_prs:
        description: 'Cap on pull requests fetched per repo (blank = no cap)'
        required: false
        type: string
        default: ''
  push:
    branches: [main]
  # No pull_request trigger: this workflow commits data to the branch it runs
  # on. PRs are validated with validate-pipeline.yaml instead.
  schedule:
    # Run daily at 5 AM UTC
    - cron: "0 5 * * *"

permissions:
  contents: write

jobs:
  extract-bronze-data:
    runs-on: ubuntu-latest
    env:
      # Production jobs don't need the dev tools; `uv run` would otherwise install them.
      UV_NO_DEV: "1"

    outputs:
      bronze-completed: ${{ steps.extraction.outputs.completed }}

    steps:
      # Not skipped under act: act implements actions/checkout as the copy that
      # populates the workspace, so skipping it leaves the container empty.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --locked

      - name: Verify organization is valid
        env:
          GITHUB_TOKEN: ${{ secrets.COOPS_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_ORG: ${{ vars.COOPS_ORG || github.repository_owner }}
        run: |
          OWNER="$GITHUB_ORG"

          # `|| true`: on a network failure curl exits non-zero and prints 000
          STATUS=$(curl -s -o user.json -w '%{http_code}' -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/users/$OWNER" || true)
          if [ "$STATUS" != "200" ]; then
            echo "[ERROR]: GitHub returned HTTP $STATUS for $OWNER"
            if [ "$STATUS" = "401" ]; then
              echo "The token was rejected: renew the COOPS_GITHUB_TOKEN secret (fine-grained tokens expire) or delete it."
            fi
            exit 1
          fi
          TYPE=$(jq -r .type user.json)
          rm -f user.json

          if [ "$TYPE" = "Organization" ]; then
            echo "[SUCCESS] Valid organization: $OWNER"
          else
            echo "[ERROR]: $OWNER is not an organization (type: $TYPE)"
            exit 1
          fi

      - name: Create data directories
        run: |
          mkdir -p data/bronze data/silver data/gold
          mkdir -p cache
          echo "[INFO] Created data layer directories"

      # The raw response corpus in `cache/` is deliberately NOT uploaded to
      # GitHub Actions cache. It holds unmodified GitHub API response bodies
      # (emails, full /users profiles), and this is a public repository, so
      # `actions/cache` would expose the corpus to any pull-request author via
      # the base-branch scope — the corpus must never leave the machine
      # (issue #107). A durable cross-run cache belongs on infrastructure we
      # control: a self-hosted runner, or the Mongo raw layer (issue #113).
      # ETag revalidation still pays off wherever a cache already exists
      # (local runs, self-hosted runners with a persistent filesystem).

      - name: Extract Bronze layer data
        id: extraction
        env:
          # COOPS_GITHUB_TOKEN (Members: Read-only) also lists concealed
          # organization members and has a higher rate limit; the default token
          # only sees public memberships. Pushing data still uses the default
          # token.
          GITHUB_TOKEN: ${{ secrets.COOPS_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_ORG: ${{ vars.COOPS_ORG || github.repository_owner }}
          MAX_REPOS: ${{ github.event.inputs.max_repos }}
          MAX_COMMITS_PER_REPO: ${{ github.event.inputs.max_commits_per_repo }}
          SKIP_STRUCTURE: ${{ github.event.inputs.skip_structure }}
          SINCE: ${{ github.event.inputs.since }}
          MAX_ISSUES: ${{ github.event.inputs.max_issues }}
          MAX_PRS: ${{ github.event.inputs.max_prs }}
        run: |
          echo "[INFO] Starting Bronze layer extraction..."
          # Use GraphQL for commits to avoid per-commit REST stats calls
          # Full history by default; max_repos/max_commits_per_repo/skip_structure/
          # since/max_issues/max_prs inputs allow a fast, limited run when
          # dispatched manually (e.g. via act).
          ARGS=(--cache --commits-method graphql)
          if [ -n "$MAX_REPOS" ]; then
            ARGS+=(--max-repos "$MAX_REPOS")
          fi
          if [ -n "$MAX_COMMITS_PER_REPO" ]; then
            ARGS+=(--max-commits-per-repo "$MAX_COMMITS_PER_REPO")
          fi
          if [ "$SKIP_STRUCTURE" = "true" ]; then
            ARGS+=(--skip-structure)
          fi
          if [ -n "$MAX_ISSUES" ]; then
            ARGS+=(--max-issues "$MAX_ISSUES")
          fi
          if [ -n "$MAX_PRS" ]; then
            ARGS+=(--max-prs "$MAX_PRS")
          fi
          if [ -n "$SINCE" ]; then
            ARGS+=(--since "$SINCE")
          fi
          uv run coops-bronze "${ARGS[@]}"

          # Check if files were generated
          if [ "$(find data/bronze -name '*.json' | wc -l)" -gt 0 ]; then
            echo "[SUCCESS] Bronze extraction completed successfully"
            echo "completed=true" >> $GITHUB_OUTPUT
          else
            echo "[ERROR] No files generated in bronze layer"
            echo "completed=false" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Generate data registry
        if: steps.extraction.outputs.completed == 'true'
        run: |
          echo "[INFO] Generating data registry..."
          uv run coops-registry

      - name: List generated files
        if: steps.extraction.outputs.completed == 'true'
        run: |
          echo "[INFO] Bronze layer files generated:"
          find data/bronze -name '*.json' -type f | sort | while read file; do
            size=$(du -h "$file" | cut -f1)
            echo "  - $file ($size)"
          done

      - name: Commit and push Bronze data
        if: steps.extraction.outputs.completed == 'true' && !env.ACT
        run: |
          git config --global user.name "CoOps Bot"
          git config --global user.email "coops@dwcorp.com.br"

          # Ensure we're on a branch (handle detached HEAD state)
          CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD)
          if [ "$CURRENT_BRANCH" = "HEAD" ]; then
            # In detached HEAD state, checkout the branch the workflow runs on
            BRANCH="${GITHUB_REF#refs/heads/}"
            echo "Checking out branch: $BRANCH"
            git checkout -B "$BRANCH"
          else
            echo "Already on branch: $CURRENT_BRANCH"
          fi

          git add data/bronze/ data/master_registry.json data/data_catalog.json

          if ! git diff --cached --quiet; then
            git commit -m "[Bronze] Update extracted GitHub metrics data

            - Extracted organization data from GitHub API
            - Generated $(find data/bronze -name '*.json' | wc -l) bronze layer files
            - Updated data registry and catalog
            - Triggered by: ${{ github.event_name }}"

            git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
            git push origin HEAD
          else
            echo "No changes to commit in Bronze layer"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trigger-silver:
    needs: extract-bronze-data
    if: needs.extract-bronze-data.outputs.bronze-completed == 'true'
    uses: ./.github/workflows/silver-process.yaml
    secrets: inherit
