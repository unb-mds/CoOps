name: Validate Pipeline (manual)

# Manual end-to-end check for a branch before its PR is marked "Ready for review".
# Runs the test suite, then a capped Bronze -> Silver -> Gold -> Aggregate -> Registry
# run against a real organization. Nothing is committed or pushed: the generated
# data/ is uploaded as an artifact, so it is safe to run on a PR branch.
#
# Normally run locally, with act (see docs/local-actions.md):
#
#   gh act workflow_dispatch -W .github/workflows/validate-pipeline.yaml \
#     --secret COOPS_GITHUB_TOKEN="$(gh auth token)" --var COOPS_ORG=<org> \
#     --input max_repos=2 --input max_commits_per_repo=10
#
# On a fork, if one is available:
#
#   gh workflow run validate-pipeline.yaml --repo <org>/CoOps --ref <branch> \
#     -f org=<org> -f max_repos=3
#
# See docs/TESTING_PULL_REQUESTS.md.

on:
  workflow_dispatch:
    inputs:
      org:
        description: 'Organization to extract (blank = COOPS_ORG repo variable, else the repository owner)'
        required: false
        type: string
        default: ''
      max_repos:
        description: 'Cap on repositories (blank = no cap)'
        required: false
        type: string
        default: '3'
      max_issues:
        description: 'Cap on issues per repo (blank = no cap)'
        required: false
        type: string
        default: '20'
      max_prs:
        description: 'Cap on pull requests per repo (blank = no cap)'
        required: false
        type: string
        default: '20'
      max_commits_per_repo:
        description: 'Cap on commits per repo (blank = no cap)'
        required: false
        type: string
        default: '50'
      since:
        description: 'Only extract commits since this ISO-8601 timestamp (blank = full history)'
        required: false
        type: string
        default: ''
      skip_structure:
        description: 'Skip repository structure extraction (faster)'
        required: false
        type: boolean
        default: true
      run_ai:
        description: 'Also run the AI analysis (needs the GEMINI_API_KEY secret)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: validate-pipeline-${{ github.ref }}-${{ inputs.org }}
  cancel-in-progress: true

jobs:
  tests:
    name: Test suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest --cov-report=term

  pipeline:
    name: Pipeline against a real organization
    needs: tests
    runs-on: ubuntu-latest
    env:
      # Whether a PAT is configured (a boolean, not the token itself).
      HAS_PAT: ${{ secrets.COOPS_GITHUB_TOKEN != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: uv sync --locked

      - name: Resolve target organization
        env:
          INPUT_ORG: ${{ inputs.org }}
          COOPS_ORG: ${{ vars.COOPS_ORG }}
          OWNER: ${{ github.repository_owner }}
          # Same token as the Bronze step, so an expired COOPS_GITHUB_TOKEN fails here.
          GH_TOKEN: ${{ secrets.COOPS_GITHUB_TOKEN || github.token }}
        run: |
          ORG="${INPUT_ORG:-${COOPS_ORG:-$OWNER}}"
          # curl, not `gh api`: GitHub-hosted runners ship the gh CLI, the act
          # runner images used for local runs (docs/local-actions.md) do not.
          BODY=$(mktemp)
          STATUS=$(curl -sS -o "$BODY" -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/users/$ORG") || STATUS=000
          if [ "$STATUS" != "200" ] || ! TYPE=$(jq -re .type "$BODY"); then
            echo "::error::Could not look up $ORG. If COOPS_GITHUB_TOKEN is set, it may have expired: renew it or delete the secret."
            exit 1
          fi
          if [ "$TYPE" != "Organization" ]; then
            echo "::error::$ORG is not an organization (type: $TYPE). Pass -f org=<organization>."
            exit 1
          fi
          echo "GITHUB_ORG=$ORG" >> "$GITHUB_ENV"
          echo "Target organization: $ORG"

      - name: Bronze - extract
        env:
          # Only this step talks to GitHub. COOPS_GITHUB_TOKEN (public
          # repositories, Members: Read-only) also lists concealed organization
          # members; the default token reads public org data only.
          GITHUB_TOKEN: ${{ secrets.COOPS_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          MAX_REPOS: ${{ inputs.max_repos }}
          MAX_ISSUES: ${{ inputs.max_issues }}
          MAX_PRS: ${{ inputs.max_prs }}
          MAX_COMMITS_PER_REPO: ${{ inputs.max_commits_per_repo }}
          SINCE: ${{ inputs.since }}
          SKIP_STRUCTURE: ${{ inputs.skip_structure }}
        run: |
          ARGS=(--cache --commits-method graphql)
          [ -n "$MAX_REPOS" ] && ARGS+=(--max-repos "$MAX_REPOS")
          [ -n "$MAX_ISSUES" ] && ARGS+=(--max-issues "$MAX_ISSUES")
          [ -n "$MAX_PRS" ] && ARGS+=(--max-prs "$MAX_PRS")
          [ -n "$MAX_COMMITS_PER_REPO" ] && ARGS+=(--max-commits-per-repo "$MAX_COMMITS_PER_REPO")
          [ -n "$SINCE" ] && ARGS+=(--since "$SINCE")
          [ "$SKIP_STRUCTURE" = "true" ] && ARGS+=(--skip-structure)
          uv run coops-bronze "${ARGS[@]}"

      - name: Silver - process
        run: uv run coops-silver

      - name: Gold - process
        run: uv run coops-gold

      - name: Gold - aggregate KPIs
        run: uv run coops-aggregate

      - name: Registry
        run: uv run coops-registry

      - name: AI analysis
        if: inputs.run_ai
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::run_ai was requested but the GEMINI_API_KEY secret is not set in ${{ github.repository }}."
            exit 1
          fi
          # Mirrors gold-process.yaml, where GITHUB_ORG is not set.
          env -u GITHUB_ORG uv run python -m coops.ai_analysis.generate_members_ai

      - name: Check outputs
        env:
          RUN_AI: ${{ inputs.run_ai }}
          SKIP_STRUCTURE: ${{ inputs.skip_structure }}
        run: |
          uv run python - <<'EOF'
          import glob, json, os, sys

          # Every file the pipeline must produce. NOT "every file the dashboard
          # reads" — that was the previous wording and it is false for 12 of the
          # 23 entries here: measured against dashboard/src (54 production files,
          # excluding the 49 test files), 11 of these are fetched by the
          # dashboard and 12 are not. The unfetched ones are still required —
          # they are pipeline outputs and this job is right to check they exist —
          # but a reader who believed the old comment could delete them on the
          # strength of it.
          #
          # The four bronze `_all` aggregates are gone from this list because
          # #170 stops producing them: they duplicated the per-repository files
          # byte for byte and commits_all.json had reached 80.6% of GitHub's
          # 100 MiB hard push limit. That is the one case here where the list
          # was wrong rather than merely mislabelled.
          required = [
              "bronze/repositories_filtered.json",
              "bronze/members_basic.json",
              "silver/contribution_metrics.json", "silver/collaboration_edges.json",
              "silver/temporal_events.json", "silver/temporal_statistics.json",
              "silver/network_statistics.json",
              "silver/members_analytics.json", "silver/available_repos.json",
              "silver/activity_heatmap.json", "silver/repository_metrics.json",
              "bronze/members_detailed.json",
              "gold/executive_dashboard.json", "gold/timeline_last_7_days.json",
              "gold/timeline_last_12_months.json",
              "master_registry.json", "data_catalog.json",
          ]
          if os.environ.get("RUN_AI") == "true":
              required.append("silver/ai/members_ai.json")
          hierarchies = []
          if os.environ.get("SKIP_STRUCTURE") != "true":
              required.append("silver/language_analysis_all.json")
              hierarchies = sorted(os.path.relpath(p, "data") for p in glob.glob("data/silver/hierarchy_*.json"))
              required += hierarchies
          # These must not be empty: the dashboard pages built on them show nothing otherwise.
          non_empty = {"bronze/repositories_filtered.json", "bronze/members_detailed.json",
                       "silver/available_repos.json", "silver/members_analytics.json"}

          def size(data):
              if isinstance(data, list):
                  # Only a leading metadata-only entry is skipped (see strip_metadata).
                  if data and isinstance(data[0], dict) and set(data[0]) == {"_metadata"}:
                      data = data[1:]
                  return len(data)
              return "object"

          rows, failed = [], False
          for rel in required:
              path = os.path.join("data", rel)
              try:
                  with open(path) as f:
                      records = size(json.load(f))
              except (OSError, ValueError) as exc:
                  rows.append((rel, f"FAILED: {exc.__class__.__name__}", "-"))
                  failed = True
                  continue
              if rel in non_empty and not records:
                  rows.append((rel, "FAILED: empty", records))
                  failed = True
              else:
                  rows.append((rel, "ok", records))

          if os.environ.get("SKIP_STRUCTURE") != "true" and not hierarchies:
              rows.append(("silver/hierarchy_<repo>.json", "FAILED: none produced", 0))
              failed = True

          summary = [
              f"### Pipeline validation: `{os.environ['GITHUB_ORG']}`",
              "",
              "| File | Status | Records |",
              "|---|---|---|",
              *[f"| `{r}` | {s} | {n} |" for r, s, n in rows],
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("\n".join(summary) + "\n")
          print("\n".join(summary))
          sys.exit(1 if failed else 0)
          EOF

      # Artifacts of a public repository can be downloaded by any signed-in
      # user, so data read with a PAT (possibly private) is not uploaded.
      - name: Skip upload notice
        if: always() && env.HAS_PAT == 'true'
        run: echo "::notice::COOPS_GITHUB_TOKEN is set, so the generated data is not uploaded."

      - name: Upload generated data
        if: always() && env.HAS_PAT != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-data-${{ github.run_id }}
          path: data/
          retention-days: 7
          if-no-files-found: ignore
